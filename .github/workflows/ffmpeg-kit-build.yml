name: Download FFmpegKit AAR

on:
  workflow_dispatch:
  push:
    branches: [fix/task-completion-summary-context-auto]
    paths:
      - .github/workflows/ffmpeg-kit-build.yml

permissions:
  contents: read

concurrency:
  group: ffmpeg-kit-aar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    name: Download prebuilt FFmpegKit AAR
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout Operit branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download existing Android dependencies from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          bash ci/script/download_android_dependencies.sh jvm "$RUNNER_TEMP/android-deps"

      - name: Extract and verify FFmpegKit AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/script/prepare_android_dependencies.py \
            --profile jvm \
            --archives "$RUNNER_TEMP/android-deps" \
            --repository "$GITHUB_WORKSPACE"

          SOURCE_AAR="$GITHUB_WORKSPACE/app/libs/ffmpeg-kit-local.aar"
          test -s "$SOURCE_AAR"
          cp "$SOURCE_AAR" "$GITHUB_WORKSPACE/ffmpeg-kit-local.aar"

          python3 - <<'PY'
          from zipfile import ZipFile

          aar = "ffmpeg-kit-local.aar"
          required = {
              "jni/arm64-v8a/libavcodec.so",
              "jni/arm64-v8a/libavdevice.so",
              "jni/arm64-v8a/libavfilter.so",
              "jni/arm64-v8a/libavformat.so",
              "jni/arm64-v8a/libavutil.so",
              "jni/arm64-v8a/libc++_shared.so",
              "jni/arm64-v8a/libffmpegkit.so",
              "jni/arm64-v8a/libffmpegkit_abidetect.so",
              "jni/arm64-v8a/libswresample.so",
              "jni/arm64-v8a/libswscale.so",
          }
          with ZipFile(aar) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              empty = sorted(
                  name for name in required & names
                  if archive.getinfo(name).file_size == 0
              )
          if missing or empty:
              raise SystemExit(f"AAR validation failed; missing={missing}, empty={empty}")
          print(f"Validated prebuilt {aar}")
          PY
          sha256sum ffmpeg-kit-local.aar

      - name: Upload FFmpegKit AAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ffmpeg-kit-local
          path: ffmpeg-kit-local.aar
          if-no-files-found: error
          retention-days: 30
